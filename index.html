<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChGV - Serwer GVRP</title>
  <style>
    /* Reset podstawowych styli i import czcionki w stylu Apple */
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Tło z nastrojowym, ciemnozielonym gradientem i poświatą */
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, rgba(12, 38, 23, 0.8) 0%, rgba(10, 15, 12, 0.95) 90%),
                  radial-gradient(circle at 90% 10%, rgba(26, 64, 41, 0.4) 0%, transparent 60%);
      background-color: #0b110e;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Ozdobny element szklanej litery V w tle (prawa strona) */
    .bg-vector {
      position: absolute;
      right: -5%;
      top: -10%;
      width: 50vw;
      height: 120vh;
      opacity: 0.08;
      pointer-events: none;
    }

    /* Główny kontener łączący formularz i logo */
    .main-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 100px;
      max-width: 1200px;
      width: 100%;
      padding: 40px;
      z-index: 2;
    }

    /* --- PANEL SZKLANY (Glassmorphism) --- */
    .login-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 40px;
      width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0px rgba(255, 255, 255, 0.1);
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    /* Stylowe inputy z ikonami */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg {
      position: absolute;
      left: 16px;
      width: 18px;
      height: 18px;
      fill: rgba(255, 255, 255, 0.35);
      transition: fill 0.3s;
    }

    .input-wrapper .eye-icon {
      left: auto;
      right: 16px;
      cursor: pointer;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .input-wrapper input:focus {
      border-color: rgba(64, 166, 103, 0.5);
      background: rgba(0, 0, 0, 0.3);
      box-shadow: 0 0 0 4px rgba(64, 166, 103, 0.15);
    }

    .input-wrapper input:focus + svg {
      fill: #40a667;
    }

    /* Główny przycisk logowania */
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #388455 0%, #29633e 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(41, 99, 62, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 132, 85, 0.4);
      background: linear-gradient(135deg, #3f9460 0%, #2e7046 100%);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    /* Separator "LUB" */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.2);
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .divider:not(:empty)::before { margin-right: .75em; }
    .divider:not(:empty)::after { margin-left: .75em; }

    /* Przycisk dolny - przeźroczysty z ramką */
    .btn-secondary {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid rgba(64, 166, 103, 0.3);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .btn-secondary svg {
      width: 16px;
      height: 16px;
      fill: rgba(255, 255, 255, 0.8);
      transition: transform 0.3s;
    }

    .btn-secondary:hover {
      background: rgba(64, 166, 103, 0.08);
      border-color: rgba(64, 166, 103, 0.6);
      color: #ffffff;
    }

    .btn-secondary:hover svg {
      transform: translateX(4px);
      fill: #ffffff;
    }

    /* --- PRAWA STRONA: BRANDING (Teksty) --- */
    .brand-section {
      max-width: 450px;
    }

    /* Wielki logotyp ChGV w stylu Apple z delikatnym gradientem metalicznym */
    .brand-logo {
      font-size: 110px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -3px;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 30%, #b3b3b3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Zielone, podświetlane "V" na końcu logotypu */
    .brand-logo span {
      font-weight: 300;
      background: linear-gradient(135deg, #59c784 0%, #29633e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tagline {
      font-size: 20px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: -0.2px;
      border-left: 2px solid #388455;
      padding-left: 14px;
    }

    /* Responsywność dla mniejszych ekranów i telefonów */
    @media (max-width: 968px) {
      .main-container {
        flex-direction: column-reverse;
        gap: 40px;
        text-align: center;
        padding: 24px;
      }
      .brand-tagline {
        border-left: none;
        padding-left: 0;
      }
      .brand-logo {
        font-size: 80px;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
      }
    }
  </style>
</head>
<body>

  <svg class="bg-vector" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M10,0 L50,80 L90,0" fill="none" stroke="rgba(64, 166, 103, 0.4)" stroke-width="0.5" />
  </svg>

  <div class="main-container">
    
    <div class="login-card">
      <form onsubmit="event.preventDefault();">
        
        <div class="form-group">
          <label for="username">Nazwa użytkownika</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/></svg>
            <input type="text" id="username" placeholder="Wprowadź nazwę użytkownika" autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Hasło</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <input type="password" id="password" placeholder="Wprowadź hasło">
            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </div>
        </div>

        <button type="submit" class="btn-primary">Zaloguj się</button>
        
        <div class="divider"></div>

        <button type="button" class="btn-secondary">
          DOWIEDZ SIĘ WIĘCEJ O CHGV
          <svg viewBox="0 0 24 24"><path d="M16.01 11H4v2h12.01v3L20 12l-3.99-4z"/></svg>
        </button>

      </form>
    </div>

    <div class="brand-section">
      <h1 class="brand-logo">ChG<span>V</span></h1>
      <p class="brand-tagline">Najlepszy serwer GVRP w Polsce.</p>
    </div>

  </div>

</body>
</html>
