<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Site with Buttons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #667eea;
            color: white;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #764ba2;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 5px;
            min-height: 30px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <div class="button-group">
            <button onclick="handleClick('Button 1')">Button 1</button>
            <button onclick="handleClick('Button 2')">Button 2</button>
            <button onclick="handleClick('Button 3')">Button 3</button>
            <button onclick="clearOutput()">Clear</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        function handleClick(buttonName) {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            output.textContent = `${buttonName} clicked at ${timestamp}`;
        }

        function clearOutput() {
            document.getElementById('output').textContent = '';
        }
    </script>
</body>
</html>
